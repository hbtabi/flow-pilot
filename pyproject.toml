[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-pilot"
version = "0.1.0"
description = "YAML-defined AI automation workflows (LLM, HTTP, webhook, email-draft steps) with a safe mock runner, CLI, webhook server and run logs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammed Hassan bin Tayyeb", email = "hasaantayyb1@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
flow-pilot = "flowpilot.cli:main"

[tool.setuptools.packages.find]
include = ["flowpilot*"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
